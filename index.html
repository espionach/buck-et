  <body>
    <div id="root">
      <!-- Initial loading state shown before React hydrates -->
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          min-height: 100vh;
          max-width: 28rem;
          margin: 0 auto;
          position: relative;
        }
        .initial-loader-content {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1rem;
          padding-bottom: 5rem;
        }
        .initial-loader-text {
          font-size: 0.75rem;
          color: #9ca3af;
          text-align: center;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .initial-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 4rem;
          background: rgba(255,255,255,0.8);
          backdrop-filter: blur(12px);
          border-top: 1px solid #e5e7eb;
          display: flex;
          align-items: center;
          justify-content: space-around;
          z-index: 50;
        }
        .initial-nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2px;
          color: #9ca3af;
          font-size: 10px;
          font-family: system-ui, -apple-system, sans-serif;
          font-weight: 500;
        }
        .bucket-svg { width: 64px; height: 80px; }
        @keyframes bucketFill {
          0% { transform: translateY(50px); }
          50% { transform: translateY(0px); }
          100% { transform: translateY(50px); }
        }
        .bucket-water {
          animation: bucketFill 2s ease-in-out infinite;
        }
        @media (prefers-color-scheme: dark) {
          .initial-nav { background: rgba(30,30,30,0.8); border-color: #333; }
          .initial-nav-item { color: #6b7280; }
        }
      </style>
      <div class="initial-loader">
        <div class="initial-loader-content">
          <svg class="bucket-svg" viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 20 C16 8, 48 8, 48 20" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M8 28 L14 72 C14 76, 50 76, 50 72 L56 28 Z" stroke="#9ca3af" stroke-width="2.5" fill="none"/>
            <ellipse cx="32" cy="28" rx="24" ry="6" stroke="#9ca3af" stroke-width="2.5" fill="white"/>
            <clipPath id="bc"><path d="M10 30 L15 70 C15 74, 49 74, 49 70 L54 30 Z"/></clipPath>
            <g clip-path="url(#bc)">
              <rect class="bucket-water" x="8" width="48" height="50" fill="#6366f1" opacity="0.3" transform="translateY(50)"/>
              <ellipse class="bucket-water" cx="32" rx="26" ry="4" fill="#6366f1" opacity="0.5" transform="translateY(50)"/>
            </g>
          </svg>
          <p class="initial-loader-text">Buck-et, we ball. Join sidequests, have fun.</p>
        </div>
        <div class="initial-nav">
          <div class="initial-nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
          </div>
          <div class="initial-nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
            <span>Groups</span>
          </div>
          <div class="initial-nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
